# release-agent 配置文件
# 修改后无需重启，下一轮采集自动生效（servers_file 支持热更新）

[center]
# release-src 服务地址，结尾不加斜杠
url = http://10.x.x.x:8000

# 推送鉴权 Token（与中心后端约定，留空则不鉴权）
token = your-secret-token-here


[agent]
# 本环境标识，中心用此区分数据来源，建议与实际环境一致
# 可选值示例: IDC / aliyun / hk
env_name = IDC

# agent 唯一标识，默认取主机名，多台 agent 时建议手动指定
# agent_id = idc-agent-01

# 转发机心跳端口（默认 8080，与转发机 HttpPort 配置一致）
heartbeat_port = 8080

# 心跳请求超时秒数
heartbeat_timeout = 3

# 并发采集线程数（转发机多时适当调大，建议不超过 50）
collect_workers = 20

# 采集并推送的间隔秒数
report_interval = 30

# 推送失败重试次数
report_retry = 3

# 每次重试间隔秒数
report_retry_delay = 5

# 方式一：直接在此列出转发机，逗号分隔
# 格式：IP  或  IP:fqdn  或  IP:fqdn:port（port 不填则用 heartbeat_port）
# servers = 10.121.21.236:mdl-fwd-01,10.121.21.240:mdl-fwd-02,10.121.21.243:mdl-fwd-03

# 方式二：从外部文件读取（与 servers 可同时使用，去重合并）
# 文件每行一条，格式同上，# 开头为注释
servers_file = /opt/release-agent/servers.txt
