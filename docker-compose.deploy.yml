version: '3.8'

services:

  # ── 后端服务 ───────────────────────────────────────────────
  release-backend:
    image: release-backend:v1.0.0
    container_name: release-backend
    restart: always
    environment:
      - DB_NAME=release_qa
      - DB_USER=alertcenter
      - DB_PASSWORD=Huawei@123
      - DB_HOST=10.24.51.155
      - DB_PORT=31431
      # GitLab 配置
      - CONFIG_GITLAB_URL=http://git.datayes.com
      - CONFIG_GITLAB_TOKEN=aHo8e9gFFQGGqjeAE9x7
      - CONFIG_GITLAB_PROJECT_ID=6481
      - CONFIG_GITLAB_BRANCH=master
      # Consul 配置
      - CONFIG_CONSUL_URL=http://consul.wmcloud.com
      - CONFIG_CONSUL_TOKEN=dbb8cd09-96db-36f8-fcba-a3f84e496241
      - CONFIG_CONSUL_KV_PREFIX=configs/mdl
      # Ansible 配置
      - ANSIBLE_SSH_USER=zhixiong.zeng
      - ANSIBLE_SSH_PASS=datayes@123
    ports:
      - "8000:8000"
    command: gunicorn -c /datayes/release/conf/gunicorn.conf.py release.wsgi:application

  # ── 前端服务 ───────────────────────────────────────────────
  release-web:
    image: release-web:v1.0.0
    container_name: release-web
    restart: always
    environment:
      # 浏览器直接请求后端域名，无需写 IP:端口
      - BACKEND_API_URL=http://mdl-release-backend.devops2.wmcloud.com/api
      - WEB_LOGIN_URL=http://mdl-release.devops2.wmcloud.com/
      - BACKEND_LOGIN_URL=http://mdl-release-backend.devops2.wmcloud.com/login
    ports:
      - "9528:80"
    depends_on:
      - release-backend

  # 数据库 (如果连接外部数据库，请注释掉此段)
