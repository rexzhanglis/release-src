# ────────────────────────────────────────────────────────────
# 将以下两个 server 块添加到宿主机 nginx 的 vhost 目录中：
#   /etc/nginx/conf.d/mdl-release.conf   （推荐）
# 或直接 include 到 nginx.conf 的 http {} 块里。
#
# 重载配置：nginx -t && nginx -s reload
# ────────────────────────────────────────────────────────────

# ── 前端：mdl-release.devops2.wmcloud.com ─────────────────
server {
    listen       80;
    server_name  mdl-release.devops2.wmcloud.com;

    client_max_body_size  100m;

    location / {
        proxy_pass         http://127.0.0.1:9528;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── 后端：mdl-release-backend.devops2.wmcloud.com ─────────
server {
    listen       80;
    server_name  mdl-release-backend.devops2.wmcloud.com;

    client_max_body_size  100m;   # 支持上传大文件（如 Anaconda 包）

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # Ansible 任务耗时较长
    }
}
