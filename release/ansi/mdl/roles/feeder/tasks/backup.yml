- name: set backup dir
  set_fact: backup_dir={{ backups_dir }}/{{ executable | default('feeder_handler') }}_{{ existing_version }}_{{ ansible_date_time.iso8601_basic_short }}

- name: create backup dir
  file:
    path: "{{ backup_dir }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
  become: true

- name: backup all files in install_dir
  shell: cp -r {{ install_dir }}/. {{ backup_dir }}/
  become: true
  failed_when: false
