- name: send consul-pull script
  template: src=templates/consul_pull.py.j2 dest={{ install_dir }}/consul_pull.py owner={{ user }} group={{ user }}
  become: true

- name: log before consul pull
  debug: msg="开始执行 consul pull，配置文件：{{ consul_files }}，目录：{{ install_dir }}"

- name: consul pull
  shell: "CONSUL_TOKEN={{ consul_token }} {{ remote_python | default('/usr/bin/python') }} {{ install_dir }}/consul_pull.py"
  become: true
  register: consul_pull_result

- name: log after consul pull
  debug: msg="consul pull 完成，输出：{{ consul_pull_result.stdout }}{{ consul_pull_result.stderr }}"

- name: log before start
  debug: msg="准备启动服务 {{ service_name }}"
