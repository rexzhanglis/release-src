- name: create install dir
  file: path={{ install_dir }} state=directory owner={{ user }} group={{ user }}
  become: true

- name: clean old binaries from install_dir
  shell: find {{ install_dir }} -maxdepth 1 -type f ! -name "*.cfg" -delete
  become: true

- name: unarchive package
  unarchive:
    src: "/datayes/mdl/packages/{{ package_name }}"
    dest: "{{ install_dir }}"
    owner: "{{ user }}"
    group: "{{ user }}"
  become: true

- name: copy install_items from extracted archive to install_dir
  shell: >
    cp {{ install_dir }}/mdl_release/ubuntu-14.04-gcc-4.8/{{ item }}
    {{ install_dir }}/
  with_items: "{{ install_items }}"
  become: true

- name: clean folder
  file:
    state: absent
    path: "{{ install_dir }}/mdl_release"
  become: true

- name: put files
  copy: src=files/{{ item }} dest={{ install_dir }} owner={{ user }} group={{ user }} mode=0644
  with_items: "{{ put_files }}"
  become: true
