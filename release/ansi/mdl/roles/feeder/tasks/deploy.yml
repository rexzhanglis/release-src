- name: create install dir
  file: path={{ install_dir }} state=directory owner={{ user }} group={{ user }}
  become: true

- name: unarchive package
  unarchive:
    src: "/datayes/mdl/packages/{{ package_name }}"
    dest: "{{ install_dir }}"
    owner: "{{ user }}"
    group: "{{ user }}"
  become: true

- name: copy install_items from extracted archive to install_dir
  shell: >
    cp --remove-destination {{ install_dir }}/mdl_release/ubuntu-14.04-gcc-4.8/{{ item }}
    {{ install_dir }}/
  with_items: "{{ install_items }}"
  become: true

- name: clean folder
  file:
    state: absent
    path: "{{ install_dir }}/mdl_release"
  become: true

- name: put files
  copy: src=files/{{ item }} dest={{ install_dir }} owner={{ user }} group={{ user }} mode=0644
  with_items: "{{ put_files }}"
  become: true

- name: 重新上传出口机器配置文件（保持与 init 一致）
  when: is_egress | default(false) | bool and egress_files_dir | default('') != ''
  copy:
    src: "{{ egress_files_dir }}/"
    dest: "{{ install_dir }}/"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0644'
  become: true
