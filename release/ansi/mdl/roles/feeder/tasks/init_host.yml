# ===== 服务器级初始化（每台机器只需执行一次）=====

# ===== 软件包 =====
- name: 安装常用工具包
  apt:
    name: [lrzsz, iftop, gdb, jq, dsniff, python3, python3-pip, python3-requests]
    state: present
    update_cache: yes
  ignore_errors: true
  become: true

# ===== 目录结构 =====
- name: 创建 /datayes 基础目录结构
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /datayes
    - /datayes/forward
    - /datayes/forward/bin
    - /datayes/forward/logs
    - /datayes/forward/backup
  become: true

- name: 设置 corefiles 目录权限（全局可写）
  file:
    path: /datayes/corefiles
    state: directory
    mode: '0777'
  become: true

- name: 配置 core dump 路径（sysctl）
  sysctl:
    name: kernel.core_pattern
    value: /datayes/corefiles/core.%t.%e.%p
    state: present
    reload: yes
  become: true

# ===== 运维用户 =====
- name: 创建运维用户 zhixiong.zeng
  user:
    name: "zhixiong.zeng"
    state: present
    shell: /bin/bash
    create_home: yes
  become: true

- name: 设置运维用户密码
  user:
    name: "zhixiong.zeng"
    password: "{{ 'datayes@123' | password_hash('sha512') }}"
  become: true

- name: 配置运维用户 sudoers（免密）
  copy:
    dest: /etc/sudoers.d/zhixiong_zeng
    content: "zhixiong.zeng ALL=(ALL:ALL) NOPASSWD:ALL\n"
    mode: '0440'
    validate: 'visudo -cf %s'
  become: true

# ===== 系统 limits =====
- name: 配置 limits.conf（root hard core unlimited）
  lineinfile:
    path: /etc/security/limits.conf
    line: "root hard core unlimited"
    regexp: "^root\\s+hard\\s+core"
    state: present
  become: true

- name: 配置 limits.conf（* soft core unlimited）
  lineinfile:
    path: /etc/security/limits.conf
    line: "* soft core unlimited"
    regexp: "^\\*\\s+soft\\s+core"
    state: present
  become: true

# ===== DNS =====
- name: 配置 DNS（/etc/systemd/resolved.conf）
  ini_file:
    path: /etc/systemd/resolved.conf
    section: Resolve
    option: DNS
    value: "10.22.117.2 10.22.117.3"
    no_extra_spaces: yes
  become: true

- name: 重启 systemd-resolved 使 DNS 生效
  systemd:
    name: systemd-resolved
    state: restarted
  ignore_errors: true
  become: true

# ===== NTP 时间同步（chrony）=====
- name: 安装 chrony
  apt:
    name: chrony
    state: present
  become: true

- name: 配置 chrony（/etc/chrony/chrony.conf）
  blockinfile:
    path: /etc/chrony/chrony.conf
    marker: "# {mark} IDC NTP SERVERS"
    block: |
      server 10.22.220.8 iburst prefer maxpoll 8
      server 10.22.220.7 iburst
    insertafter: EOF
  become: true

- name: 启用并启动 chrony 服务
  systemd:
    name: chrony
    enabled: yes
    state: restarted
  become: true
