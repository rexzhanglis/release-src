# ===== 服务实例级初始化（每个 MdlServer 实例执行一次）=====

# ===== 目录结构 =====
- name: 创建安装目录
  file:
    path: "{{ install_dir }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0755'

- name: 创建备份目录
  file:
    path: "{{ backups_dir }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0755'

- name: 创建日志目录
  file:
    path: "{{ install_dir | dirname }}/logs"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0755'

- name: 创建 coredump 目录 /datayes/corefiles
  file:
    path: /datayes/corefiles
    state: directory
    mode: '0777'

# ===== Coredump =====
- name: 配置 coredump（/etc/sysctl.conf）
  lineinfile:
    path: /etc/sysctl.conf
    line: "kernel.core_pattern=/datayes/corefiles/core.%t.%e.%p"
    regexp: "^kernel.core_pattern"
    state: present

- name: sysctl -p 使 coredump 配置生效
  command: sysctl -p
  ignore_errors: true

# ===== Systemd 服务 =====
- name: 部署 systemd service 文件
  template:
    src: "{{ role_path }}/templates/mdl-forward.service.j2"
    dest: "/lib/systemd/system/{{ service_name }}.service"
    owner: root
    group: root
    mode: '0644'

- name: systemctl daemon-reload 并启用服务开机自启
  systemd:
    name: "{{ service_name }}"
    enabled: yes
    daemon_reload: yes

# ===== 出口机器额外步骤 =====
- name: 上传出口机器配置文件到安装目录
  when: is_egress | default(false) | bool and egress_files_dir != ''
  copy:
    src: "{{ egress_files_dir }}/"
    dest: "{{ install_dir }}/"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0644'

- name: 添加 cron 任务（每 10 分钟拉取云配置）
  when: is_egress | default(false) | bool
  cron:
    name: "get_cloud_conf"
    job: "cd {{ install_dir }} && {{ remote_python | default('/usr/bin/python3') }} get_cloud_conf.py"
    minute: "*/10"
    state: present
