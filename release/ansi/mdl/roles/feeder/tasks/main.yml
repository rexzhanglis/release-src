- name: fail if executable is feeder_client
  fail:
    msg: "feeder_client 不支持版本发布，请检查发布对象配置。"
  when: executable == 'feeder_client'

- name: fail if executable is unknown
  fail:
    msg: "未知的 executable '{{ executable }}'，支持: feeder_handler, feeder_receiver。"
  when: executable not in _install_items_map

- name: resolve install_items and backup_items
  set_fact:
    install_items: "{{ _install_items_map[executable] }}"
    backup_items: "{{ _backup_items_map[executable] }}"

- debug: msg="deploying {{ executable }} {{ version }}"

- name: 初始化系统（全新部署时执行）
  when: is_new_deploy | default(false) | bool
  include_tasks: init.yml

- name: check python
  include_tasks: check_python.yml

- name: check version
  include_tasks: check_version.yml
  tags:
    - version
- debug: msg="已安装版本:{{ existing_version }}"
  tags:
    - version
- debug: msg="将安装版本:{{ version }}"

- name: download package
  include_tasks: download.yml

- name: stop
  when: existing_version != "null"
  include_tasks: stop.yml

- name: backup
  when: existing_version != "null"
  include_tasks: backup.yml

- name: deploy
  include_tasks: deploy.yml

- name: update version file
  template: src=templates/version.j2 dest={{ install_dir }}/version owner={{ user }} group={{ user }}
  become: true

- name: config
  include_tasks: config.yml

- name: start
  when: start_after_deploy | default(True)
  include_tasks: start.yml
